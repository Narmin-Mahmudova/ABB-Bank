<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
    </head>
    <body>
        <button>Hide</button>
        <!-- <button id="stop">Stop</button> -->
        <ul>
            <li>Gunay</li>
            <li>Xedice</li>
            <li>Asif</li>
            <li>Ilkin</li>
        </ul>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            let flag = true
            $('button').click(function() {
                $('ul').fadeToggle(3000, function(){
                    $('button').text(flag ? 'Show' : 'Hide')
                    flag = !flag
                })
            })
            // $('#stop').click(function() {
            //     $('ul').stop()
            // })

            $('ul').css({
                border: '1px solid orange',
                background: 'yellow',
                padding: '20px 30px'
            })
        </script>
    </body>
</html>
