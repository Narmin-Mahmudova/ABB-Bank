<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Async</title>
</head>
<body>
    <div id="prdctList"></div>

    <script>
        const prdctList = document.getElementById('prdctList');

        async function getPrdctList(){
            try {
                const res = await fetch('https://fakestoreapi.com/products');
                const data = await res.json();
                prdctList.innerHTML = `
                    <div style="display:flex; flex-wrap:wrap; gap:10px;">
                        ${data.map(product => `
                        <div style="border:1px solid #ccc; padding:10px; width:200px;">
                            <h3 style="color: blue;">${product.title}</h3>
                            <img src="${product.image}" width="100"/>
                            <h4>${product.price} $</h4>
                        </div>
                        `).join("")}
                    </div>
                    `;
            } catch(error){
                console.log('Xeta bas verdi');
            }
        }
        getPrdctList();
    </script>
</body>
</html>
