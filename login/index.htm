<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Portalı</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex justify-center items-center">
        <div class="inline bg-gray-100 p-10 rounded-xl mt-20">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Giriş Portalı</h1>
            <div class="space-y-6">
                <input id="username" type="text" placeholder="Daxil olun" class="w-full p-4 border border-blue-500 rounded-xl bg-white">
                <input id="password" type="password" placeholder="Şifrə" class="w-full p-4 border border-blue-500 rounded-xl bg-white">
            </div>
            <button onclick="check()" class="w-full mt-8 bg-blue-500 text-white font-bold cursor-pointer py-4 rounded-xl transition duration-300">Giriş et</button>
            <p id="error" class="text-red-500 font-semibold mt-4 text-sm"></p>
            <p id="correct" class="text-green-500 font-semibold mt-4 text-sm"></p>
        </div>
    </div>

    <script>
        function check(){
            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            error.innerText = "";
            correct.innerText = "";

            if (username === "" || !username.includes(".com") || !username.includes("@")) {
                error.innerText = "Düzgün giriş edin";
                return;
            }

            if (username.includes(" ")) {
                error.innerText = "Boşluq olmaz";
                return;
            }


            if (password.length < 6) {
                error.innerText = "Şifrə minimum 6 simvol olmalıdır";
                return;
            }

            if (password.includes(" ")) {
                error.innerText = "Şifrədə boşluq olmaz";
                return;
            }

            const correctUsername = "admin@mail.com";
            const correctPassword = "admin123";

            if (
                (username === correctUsername) && password === correctPassword
            ) {
                correct.innerText = "Giriş uğurludur. Sistemimizə xoş gəldiniz!";
            } else {
                error.innerText = "Yanlış məlumat ";
            }
        }
    </script>
</body>
</html>
