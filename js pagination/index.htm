<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Pagination</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 800px;
        text-align: center;
    }

    #prdctList {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-top: 20px;
    }

    .card {
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 10px;
        background: #f9f9f9;
    }

    #pagination {
        margin-top: 20px;
    }

    #pagenumber {
        margin: 0 10px;
        font-weight: bold;
    }

    button {
        padding: 8px 15px;
        margin: 5px;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="container">
        <div id="prdctList"></div>

        <div id="pagination">
            <button id="prev">Geri</button>
            <span id="pagenumber">Sehife: 1</span>
            <button id="next">İleri</button>
        </div>
    </div>

    <script>
        let page = 1;
        const limit = 3;
        let Data = [];

        const prev = document.getElementById('prev');
        const next = document.getElementById('next');
        const pagenumber = document.getElementById('pagenumber');
        const prdctList = document.getElementById('prdctList');

        async function getData() {
            const res = await fetch('https://fakestoreapi.com/products');
            Data =  await res.json();   
            render();     
        }
        function render(){
            const start = (page - 1) * limit;
            const end = start + limit;
            const item = Data.slice(start, end);

            prdctList.innerHTML = item.map (item =>
                `<div class="card">
                    <h3>${item.id}. ${item.title.slice(0, 25)}</h3>
                    <img src="${item.image}" alt="${item.title}" width="100" height="100"/>
                    <p>${item.description.slice(0, 80)}...</p>
                </div>`
            ).join('');

            pagenumber.innerHTML = `Sehife: ${page}`;
            prev.disabled = page === 1;
            next.disabled = end >= Data.length;
        }

        next.onclick = () => { page++; render(); };
        prev.onclick = () => { page--; render(); };

        getData();
    </script>
</body>
</html>
